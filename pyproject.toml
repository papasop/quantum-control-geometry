[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-control-geometry-artifact"
version = "0.2.0"
description = "Reproducible audits for covariant local jets of response-matched neutral-atom controls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Y. Y. N. Li"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
formal = ["python-flint==0.8.0"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/papasop/quantum-control-geometry"
Issues = "https://github.com/papasop/quantum-control-geometry/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
