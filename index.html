<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Da Chat</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="workspace-rail" aria-label="工作区">
        <button class="workspace-mark active" type="button" title="Da">Da</button>
        <button class="workspace-mark" type="button" title="新增工作区">+</button>
      </aside>

      <aside class="sidebar">
        <header class="brand">
          <div>
            <strong>Da Chat</strong>
            <span>Open collaboration workspace</span>
          </div>
          <span class="presence-dot" aria-label="在线"></span>
        </header>

        <label class="quick-search" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索消息、频道、成员">
        </label>

        <section class="nav-section">
          <div class="section-title">
            <span>频道</span>
            <button id="newChannelButton" type="button" title="新建频道">+</button>
          </div>
          <nav id="channelList" class="channel-list" aria-label="频道列表"></nav>
        </section>

        <section class="nav-section">
          <div class="section-title">
            <span>私信</span>
          </div>
          <nav id="dmList" class="channel-list" aria-label="私信列表"></nav>
        </section>

        <section class="account-panel">
          <div class="avatar">B</div>
          <div>
            <strong>Bai</strong>
            <span>构建 Da 开源协作</span>
          </div>
        </section>
      </aside>

      <main class="chat-pane">
        <header class="chat-header">
          <div>
            <div class="channel-kicker" id="channelKicker"># channel</div>
            <h1 id="channelTitle">general</h1>
            <p id="channelTopic"></p>
          </div>
          <div class="header-actions">
            <button id="toggleDetails" type="button">详情</button>
            <button id="clearSearch" type="button">清除搜索</button>
          </div>
        </header>

        <section class="stats-strip" aria-label="工作区概览">
          <div><strong id="messageCount">0</strong><span>消息</span></div>
          <div><strong id="memberCount">0</strong><span>成员</span></div>
          <div><strong id="channelCount">0</strong><span>频道</span></div>
        </section>

        <section id="messageList" class="message-list" aria-live="polite"></section>

        <form id="composerForm" class="composer">
          <label class="sr-only" for="messageInput">发送消息</label>
          <textarea id="messageInput" rows="3" placeholder="发送消息到当前频道，支持 @成员 和 #频道"></textarea>
          <div class="composer-actions">
            <div class="composer-tools" aria-label="消息工具">
              <button type="button" title="附件">＋</button>
              <button type="button" title="代码">{} </button>
              <button type="button" title="表情">☺</button>
            </div>
            <button class="primary-button" type="submit">发送</button>
          </div>
        </form>
      </main>

      <aside id="detailsPanel" class="details-panel">
        <section>
          <h2>频道信息</h2>
          <p id="detailsTopic"></p>
        </section>
        <section>
          <h2>成员</h2>
          <div id="memberList" class="member-list"></div>
        </section>
        <section>
          <h2>开源路线</h2>
          <ul class="roadmap">
            <li>实时 WebSocket 消息同步</li>
            <li>自托管账号与权限</li>
            <li>频道、线程、文件搜索</li>
            <li>机器人与 webhook 插件</li>
          </ul>
        </section>
      </aside>
    </div>

    <dialog id="channelDialog">
      <form id="channelForm" method="dialog" class="dialog-card">
        <header>
          <h2>新建频道</h2>
          <button id="closeChannelDialog" type="button" title="关闭">×</button>
        </header>
        <label>
          名称
          <input name="name" required maxlength="28" placeholder="例如 design-review">
        </label>
        <label>
          主题
          <textarea name="topic" rows="3" required placeholder="这个频道用来讨论什么？"></textarea>
        </label>
        <button class="primary-button" type="submit">创建频道</button>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
