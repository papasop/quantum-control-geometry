name: Artifact checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reference-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify bundled scientific gates
        run: python tools/verify_reference_results.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tools tests

  manuscript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/manuscript.tex

      - name: Confirm PDF was produced
        run: test -s manuscript.pdf
