name: Artifact checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reference-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify bundled scientific gates
        run: python tools/verify_reference_results.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify repository SHA-256 snapshot
        run: sha256sum -c SHA256SUMS.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tools tests

  manuscript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Compile split manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Confirm PDF was produced
        run: test -s paper/main.pdf

      - name: Check manuscript PDF text
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pages=$(pdfinfo paper/main.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -ge 20
          test "$pages" -le 21
          pdftotext paper/main.pdf manuscript.txt
          grep -q "Exact-Root Certification of Finite-Error Ordering" manuscript.txt
          grep -q "in Quantum Control" manuscript.txt
          grep -q "declared global error coordinates" manuscript.txt
          grep -q "computer-assisted exact-root finite-error ordering theorem" manuscript.txt
          grep -q "global fibre structure remains open" manuscript.txt
          grep -q "0.95" manuscript.txt
          grep -q "predeclared" manuscript.txt
          grep -q "threshold-level" manuscript.txt
          ! grep -q "0.996992" manuscript.txt
          grep -q "34/66" manuscript.txt
          grep -q "52/66" manuscript.txt
          grep -q "66/66" manuscript.txt
          grep -q "Code and Data Availability" manuscript.txt
          grep -q "github.com/papasop/quantum-control-geometry" manuscript.txt
          grep -q "284974c9f6b952f4e114c8c5bdc9c2c299c4065c" manuscript.txt
          ! grep -q "zero-point Taylor jet" manuscript.txt
          ! grep -q "0.998496" manuscript.txt
          ! grep -q "35/66" manuscript.txt
          ! grep -q "53.03" manuscript.txt
          ! grep -q "Finite-Error Robustness in Quantum Control" manuscript.txt
          ! grep -q "Geometric Prediction and Exact-Root Certification" manuscript.txt
          ! grep -q "two claims in the title" manuscript.txt

      - name: Verify published Zenodo metadata
        run: |
          grep -q "10.5281/zenodo.21831180" README.md
          grep -q "10.5281/zenodo.21831180" CITATION.cff
          grep -q "10.5281/zenodo.21831180" REVIEWER_GUIDE.md
