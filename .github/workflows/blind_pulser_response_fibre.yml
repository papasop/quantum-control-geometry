name: Blind Pulser response-fibre prospective test

on:
  workflow_dispatch:

jobs:
  blind-pulser-response-fibre:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked Pulser environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pulser-blind.txt

      - name: Recompute 20 paths x 6 error points
        run: |
          python tests/external/pasqal_blind_response_fibre_v1_0.py \
            --report /tmp/pasqal_blind_response_fibre_v1_0_report.json

      - name: Verify committed summary gates
        run: python tools/verify_blind_pulser_summary.py

      - name: Record generated report checksum
        if: always()
        run: |
          echo "Generated report SHA-256:"
          sha256sum /tmp/pasqal_blind_response_fibre_v1_0_report.json || true

      - name: Upload generated machine report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blind-pulser-response-fibre-report
          path: /tmp/pasqal_blind_response_fibre_v1_0_report.json
          if-no-files-found: warn
