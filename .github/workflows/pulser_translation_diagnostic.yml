name: Pulser translation diagnostic

on:
  workflow_dispatch:

jobs:
  pulser-translation-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pulser diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pulser.txt

      - name: Validate Pulser external ordering-robustness report
        run: python tests/external/pulser_translation_diagnostic.py
